name: historical-l2-collector

on:
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: "Bounded collection duration"
        required: false
        default: "240"
  schedule:
    # Best-effort cadence; this is forward collection, not historical backfill.
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: read

concurrency:
  group: historical-l2-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install .

      - name: Collect and validate bounded public L2
        id: collect
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: "1"
        run: >-
          python -m crypto_signal_system.cli
          --config config/default.yaml
          collect-historical-l2
          --symbols BTCUSDT ETHUSDT SOLUSDT
          --duration-seconds "${{ github.event.inputs.duration_seconds || '240' }}"
          --archive-dir artifacts/l2/raw
          --normalized-output artifacts/l2/normalized/latest.jsonl
          --manifest artifacts/l2/manifests/latest.json

      - name: Write run metadata
        if: always()
        run: |
          mkdir -p artifacts/l2
          cat > artifacts/l2/run-metadata.json <<'JSON'
          {
            "workflow": "historical-l2-collector",
            "run_id": "${{ github.run_id }}",
            "attempt": "${{ github.run_attempt }}",
            "repository": "${{ github.repository }}",
            "sha": "${{ github.sha }}",
            "analysis_only": true,
            "live_execution_enabled": false,
            "paper_trading_enabled": false,
            "source_mode": "public_okx_bybit_forward_websocket",
            "collector_step_outcome": "${{ steps.collect.outcome }}"
          }
          JSON

      - name: Upload raw, normalized, and manifest artifacts
        if: always()
        uses: actions/upload-artifact@v4.6.0
        with:
          name: historical-l2-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/l2/
          if-no-files-found: error
          retention-days: 90

      - name: Fail workflow if validation was blocked
        if: steps.collect.outcome == 'failure'
        run: |
          echo "Historical-L2 validation was blocked. The artifact is preserved for audit, but the dataset is not research-usable."
          exit 1
