name: crypto-signal-analysis

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */4 * * *"

permissions:
  contents: read

concurrency:
  group: crypto-signal-analysis
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install . pytest==8.3.4

      - name: Run tests
        run: python -m pytest

      - name: Generate analysis-only report
        env:
          PYTHONUNBUFFERED: "1"
        run: python -m crypto_signal_system.cli --config config/default.yaml scan --dry-run

      - name: Upload reports and logs
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: crypto-signal-artifacts-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
