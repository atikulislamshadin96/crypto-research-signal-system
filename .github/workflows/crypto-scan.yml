name: crypto-signal-analysis

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

concurrency:
  group: crypto-signal-analysis
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install . pytest==8.3.4

      - name: Restore Bybit WebSocket state
        uses: actions/cache/restore@v4
        with:
          path: artifacts/live
          key: bybit-ws-state-${{ github.ref_name }}-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            bybit-ws-state-${{ github.ref_name }}-${{ runner.os }}-

      - name: Run tests
        run: python -m pytest

      - name: Run periodic analysis-only WebSocket scan
        env:
          PYTHONUNBUFFERED: "1"
        run: python -m crypto_signal_system.cli --config config/default.yaml scan --dry-run

      - name: Save Bybit WebSocket state
        if: always() && hashFiles('artifacts/live/bybit_ws_state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: artifacts/live
          key: bybit-ws-state-${{ github.ref_name }}-${{ runner.os }}-${{ github.run_id }}

      - name: Upload reports and logs
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: crypto-signal-artifacts-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
