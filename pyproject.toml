[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-signal-system"
version = "0.1.0"
description = "Research-first, analysis-only crypto market signal generation with auditability and capital-preservation guardrails."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas==2.2.3",
  "PyYAML==6.0.2",
  "requests==2.32.3",
  "websockets>=12.0,<16.0",
  "pyarrow>=17.0,<20.0",
]

[project.scripts]
crypto-signal = "crypto_signal_system.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
